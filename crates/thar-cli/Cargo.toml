[package]
name = "thar-cli"
description = "thar-rs: the Rust TUI binary for Thar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "thar-rs"
path = "src/main.rs"

[dependencies]
thar-core.workspace = true
thar-store.workspace = true
thar-tui.workspace = true
ratatui.workspace = true
jiff.workspace = true

# PTY integration tests (`tests/pty`) only. Neither crate is linked into the
# shipped `thar-rs` binary, so the read-only build and its dependency tree are
# unchanged.
[dev-dependencies]
portable-pty = "0.9.0"
vt100 = "0.18.1"

[lints]
workspace = true
