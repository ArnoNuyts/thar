[package]
name = "thar-wasm"
description = "WebAssembly boundary for the Thar core (Node target)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
thar-core.workspace = true
wasm-bindgen.workspace = true

# wasm-pack 0.13.1 bundles binaryen 117, whose defaults predate the post-MVP
# features rustc 1.99 emits (bulk memory first). Enable them explicitly so
# `wasm-pack build` works on every machine without a newer binaryen.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
  "-O",
  "--strip-debug",
  "--enable-bulk-memory",
  "--enable-sign-ext",
  "--enable-mutable-globals",
  "--enable-nontrapping-float-to-int",
  "--enable-multivalue",
  "--enable-reference-types",
]
