[package]
name = "thar-wasm"
description = "WebAssembly boundary for the Thar core (Node target)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
thar-core.workspace = true
wasm-bindgen.workspace = true

# Tests only: the JSON envelope is validated with a real parser on the native
# target. The shipped module writes JSON by hand so it stays inside the size
# budget and the field order stays visible in the code.
[dev-dependencies]
serde_json = "1.0"

# The build uses the workspace's custom `wasm` profile, so wasm-pack reads the
# `custom` metadata table (0.14+). The binaryen wasm-pack falls back to predates
# the post-MVP features rustc 1.99 emits (bulk memory first), so enable them
# explicitly.
#
# wasm-pack 0.15.1 passes these arguments to whichever `wasm-opt` it runs,
# including one found on `PATH` (CI installs binaryen from apt). They must stay
# valid for both the bundled fallback and a system optimizer.
[package.metadata.wasm-pack.profile.custom]
wasm-opt = [
  "-O",
  "--strip-debug",
  "--enable-bulk-memory",
  "--enable-sign-ext",
  "--enable-mutable-globals",
  "--enable-nontrapping-float-to-int",
  "--enable-multivalue",
  "--enable-reference-types",
]

[lints]
workspace = true
