[package]
name = "thar-core"
description = "Pure todo.txt domain model for Thar: parse, serialize, dates, recurrence, setters, query, rows, navigation, limits, validation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# No dependencies: parsing is hand-written so the WASM core stays small and
# the behaviour matches the TypeScript oracle exactly.
[dependencies]

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
