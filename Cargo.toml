# Rust workspace for the Thar port. See docs/rust-port/PLAN.md.
#
# thar-core is the pure todo.txt domain; thar-wasm is the WebAssembly batch
# boundary loaded by the Node app during the incremental adoption phase.
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# The minimum the code actually needs (edition 2024 + let chains); the CI
# toolchain is pinned separately in rust-toolchain.toml.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/ArnoNuyts/thar"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.dependencies]
thar-core = { path = "crates/thar-core", version = "0.1.0" }
thar-store = { path = "crates/thar-store", version = "0.1.0" }
thar-tui = { path = "crates/thar-tui", version = "0.1.0" }
wasm-bindgen = "0.2.130"

# Native TUI (CP6). Pinned: ratatui is 0.x, so upgrades stay deliberate.
ratatui = "0.30.2"
jiff = "0.2.45"

[profile.release]
lto = true
codegen-units = 1
# Ship without symbols: the archives only contain the binary, and this keeps
# them small. Native keeps the default `panic = "unwind"`; the `wasm` profile
# below overrides that to `abort`.
strip = true

# Keep the shipped WASM small: the size gate is 250 KB raw / 100 KB gzip.
#
# This is deliberately a separate profile so the native `thar-rs` release build
# keeps `panic = "unwind"` (and the default speed optimization). `strip` is
# reset because wasm-bindgen needs the `target_features` custom section to
# detect which Wasm features the module uses; with `strip = true` it warns that
# the section is missing. The `wasm-opt --strip-debug` step configured in
# `crates/thar-wasm/Cargo.toml` does the stripping instead.
# `scripts/build-wasm.mjs` selects it with `wasm-pack build --profile wasm`
# (wasm-pack 0.14+; CI pins 0.15.1). The same profile is available to a direct
# `cargo build --profile wasm --target wasm32-unknown-unknown`.
[profile.wasm]
inherits = "release"
opt-level = "s"
panic = "abort"
strip = "none"
