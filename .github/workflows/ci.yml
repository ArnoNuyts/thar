name: CI

on:
  push:
    branches: ["main", "release/next", "feature/rust-port"]
  pull_request:
    branches: ["main", "release/next", "feature/rust-port"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # `macos-latest` currently resolves to the brand-new macos-26 arm64
        # image, whose hosted pool is capacity-constrained: jobs can stay
        # queued until the job timeout and fail without running a step. Pin the
        # mature macOS 15 arm64 image instead; this leg only needs a real
        # Darwin host, not the newest OS. See actions/runner-images#13882.
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Setup repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Verify formatting
        run: npm run fmt:check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  port-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: UTC

    steps:
      - name: Setup repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the contract, the golden file and the candidate protocol
        run: npm run port:contract:check

      - name: Prove the seeded mutations are caught
        run: npm run port:selftest

      # CP3b: the live rows contract, TS-only here. The WASM candidate half runs
      # in the rust workflow's `wasm` job, where the package is built.
      - name: Rows contract (oracle, candidate protocol, mutation proof)
        run: npm run port:contract:rows

      # CP4: the write contract, TS-only here. The WASM candidate half runs in
      # the rust workflow's `wasm` job, where the package is built.
      - name: Write contract (oracle, candidate protocol, mutation proof)
        run: npm run port:contract:write

      # CP3b2c: the parse contract, TS-only here. The self candidate proves
      # `Todo.fromParts` is lossless and the seeded reconstruction mutations are
      # caught; the wired WASM read path runs in the rust workflow.
      - name: Parse contract (factory, candidate protocol, mutation proof)
        run: npm run port:contract:parse

  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Setup repo
        uses: actions/checkout@v7
        with:
          # React Doctor compares a pull request against its merge base, which a
          # shallow checkout does not contain.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: React Doctor
        env:
          # Set on pull_request events only; empty on push and manual runs.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          args=(. --verbose --lint --blocking warning --no-score)
          if [ -n "$BASE_SHA" ]; then
            # Only gate on issues this PR introduces, not pre-existing debt.
            args+=(--scope changed --base "$BASE_SHA")
          fi
          npx react-doctor "${args[@]}"

  version-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Setup repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check release version
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$BASE_REF" != "main" ]; then
            echo "Release version check only applies to main."
            exit 0
          fi

          version="$(node -p "require('./package.json').version")"
          if [[ "$version" == *-* ]]; then
            echo "main must contain a stable version, got $version" >&2
            exit 1
          fi

          latest="$(git tag -l 'v*' | grep -v -- '-' | sort -V | tail -n1 || true)"
          if [ -n "$latest" ]; then
            if [ "$version" = "${latest#v}" ]; then
              echo "Version $version has already been released as $latest" >&2
              exit 1
            fi

            newest="$(printf '%s\n%s\n' "${latest#v}" "$version" | sort -V | tail -n1)"
            if [ "$newest" != "$version" ]; then
              echo "Version $version must be greater than $latest" >&2
              exit 1
            fi
          fi

          echo "Releasing v$version."

      - name: Install dependencies
        run: npm ci

      # `npm pack` runs `prepack`, which builds the WASM core the published
      # package ships.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: version-guard

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.1

      - name: Install binaryen
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen

      - name: Verify package contents
        run: npm pack --dry-run

  package-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Setup repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The published package ships the real WASM core (CP5), so packing it
      # requires Rust. The build is not optional: a tarball without
      # `crates/thar-wasm/pkg/thar_wasm.js` fails the checks below.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: package-smoke

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.1

      - name: Install binaryen
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen
          wasm-opt --version

      - name: Install dependencies
        run: npm ci

      - name: Pack package
        id: pack
        run: echo "tarball=$(npm pack --silent | tail -n1)" >> "$GITHUB_OUTPUT"

      # `npm pack` runs `prepack`, so `pkg/` now exists. Run the full suite in
      # the configuration users actually get (WASM present, THAR_CORE unset);
      # the Node matrix covers the source checkout without a package.
      - name: Run the full suite against the shipped WASM package
        run: npm test

      - name: Verify the tarball ships the WASM core
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          contents="$(tar -tzf "$TARBALL")"
          for required in \
            package/crates/thar-wasm/pkg/thar_wasm.js \
            package/crates/thar-wasm/pkg/thar_wasm_bg.wasm; do
            if ! grep -qx "$required" <<<"$contents"; then
              echo "::error::$TARBALL is missing $required" >&2
              echo "$contents" >&2
              exit 1
            fi
          done
          echo "$TARBALL ships the WASM core."

      - name: Install the tarball into a temp project
        id: install
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/smoke"
          mkdir -p "$project"
          cd "$project"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$TARBALL"
          echo "project=$project" >> "$GITHUB_OUTPUT"

      - name: Smoke test the default and the TypeScript escape hatch
        env:
          PROJECT: ${{ steps.install.outputs.project }}
        run: |
          set -euo pipefail
          cd "$PROJECT"
          bin="node_modules/.bin/thar"
          if [ ! -x "$bin" ]; then
            echo "::error::the installed package has no thar bin" >&2
            exit 1
          fi
          # Default mode: no THAR_CORE, so the app uses the packaged Rust core.
          "$bin" --version
          "$bin" --help >/dev/null
          # The documented escape hatch still runs.
          THAR_CORE=ts "$bin" --version
          THAR_CORE=ts "$bin" --help >/dev/null

      # The packaged module, required exactly as `dist/main.js` resolves it.
      # `coreVersion()` proves the tarball's WASM loads; a missing or broken
      # package would throw here instead of silently falling back.
      - name: Verify the packaged core loads
        env:
          PROJECT: ${{ steps.install.outputs.project }}
        run: |
          cd "$PROJECT"
          node - <<'NODE'
          const path = require("node:path");
          const pkg = require.resolve("@arnoarnoarno/thar/package.json");
          const entry = path.join(path.dirname(pkg), "crates", "thar-wasm", "pkg", "thar_wasm.js");
          const core = require(entry);
          const version = core.coreVersion();
          if (typeof version !== "string" || version.length === 0) {
            throw new Error("packaged coreVersion() is empty");
          }
          const parsed = JSON.parse(core.parseFile("one\n", "2026-11-15"));
          if (parsed.ok !== true || parsed.todos.length !== 1) {
            throw new Error("packaged parseFile() did not answer");
          }
          console.log(`packaged core ok (core ${version}, default THAR_CORE)`);
          NODE
