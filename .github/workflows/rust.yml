name: Rust

# Path-filtered so the existing Node pipeline is unaffected while the Rust
# port lands incrementally. Pull requests are filtered by path only; the push
# branch list keeps the long-lived port branch covered without running Rust on
# every Node-only release commit.
on:
  push:
    branches: ["main", "release/next", "feature/rust-port"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "testdata/port/**"
      # The candidate, the TS adapter bridge, and its tests are part of the
      # WASM parity job even though they contain no Rust.
      - "tools/port/**"
      - "logic/core-wasm.ts"
      - "logic/limits.ts"
      - "unit-tests/core-wasm.test.ts"
      - "unit-tests/todo-from-parts.test.ts"
      # CP4: the write contract's oracle is the production writer, and the
      # data-safety suite drives the real package through the atomic replace.
      - "logic/todo-file-helpers.ts"
      - "utils/runtime.ts"
      # The write contract's guard probes call `findUnsafeTodoTextCodePoint`.
      - "logic/control-characters.ts"
      - "unit-tests/port-write.test.ts"
      - "unit-tests/todo-file-write-safety.test.ts"
      # The rows contract runs the production pipeline, so its real
      # dependencies must trigger this job too; a change in any of them can
      # break the oracle without touching tools/port/**.
      - "logic/indexes.ts"
      - "logic/Todos.ts"
      - "logic/todo.ts"
      - "logic/todo-file-validation.ts"
      - "logic/dates.ts"
      - "logic/patterns.ts"
      - "logic/recurrence.ts"
      - "logic/control-characters.ts"
      - "logic/todo-file-helpers.ts"
      - "utils/search-utils.ts"
      - "utils/collation-locale.ts"
      - "types/enums.ts"
      - "types/types.ts"
      - "unit-tests/port-rows.test.ts"
      - "unit-tests/read-path-wiring.test.tsx"
      - "unit-tests/test-utils.ts"
      # The wasm job runs `npm ci`, `vitest` and `vite-node`, so dependency,
      # lockfile and Vite/TypeScript config changes can break it. Path filters
      # are workflow-level, so a Node-only dependency bump re-runs the cargo
      # job too; that is accepted — an unnecessary cached cargo run is cheaper
      # than a red wasm job discovered after merge.
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "testdata/port/**"
      - "tools/port/**"
      - "logic/core-wasm.ts"
      - "logic/limits.ts"
      - "unit-tests/core-wasm.test.ts"
      - "unit-tests/todo-from-parts.test.ts"
      # CP4: the write contract's oracle is the production writer, and the
      # data-safety suite drives the real package through the atomic replace.
      - "logic/todo-file-helpers.ts"
      - "utils/runtime.ts"
      # The write contract's guard probes call `findUnsafeTodoTextCodePoint`.
      - "logic/control-characters.ts"
      - "unit-tests/port-write.test.ts"
      - "unit-tests/todo-file-write-safety.test.ts"
      - "logic/indexes.ts"
      - "logic/Todos.ts"
      - "logic/todo.ts"
      - "logic/todo-file-validation.ts"
      - "logic/dates.ts"
      - "logic/patterns.ts"
      - "logic/recurrence.ts"
      - "logic/control-characters.ts"
      - "logic/todo-file-helpers.ts"
      - "utils/search-utils.ts"
      - "utils/collation-locale.ts"
      - "types/enums.ts"
      - "types/types.ts"
      - "unit-tests/port-rows.test.ts"
      - "unit-tests/read-path-wiring.test.tsx"
      - "unit-tests/test-utils.ts"
      # Keep in sync with the push filter above.
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Setup repo
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Verify formatting
        # `cargo fmt` does not resolve dependencies, so it has no `--locked`.
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --all-features

  wasm:
    name: wasm package + size budget
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Setup repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - name: Install wasm-pack
        uses: taiki-e/install-action@wasm-pack

      # wasm-pack uses a system `wasm-opt` when binaryen is on PATH, so on CI
      # this apt install is the optimizer that runs. The crate's
      # `[package.metadata.wasm-pack.profile.release]` flags only cover the
      # bundled binaryen fallback used by developers without it; keep both.
      - name: Install binaryen
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen
          wasm-opt --version

      - name: Build WASM package (Node target)
        run: wasm-pack build crates/thar-wasm --release --target nodejs --out-dir pkg --locked

      - name: Check WASM size budget
        run: |
          set -euo pipefail
          wasm="crates/thar-wasm/pkg/thar_wasm_bg.wasm"
          raw="$(stat -c%s "$wasm")"
          gzip="$(gzip -9 -c "$wasm" | wc -c)"
          echo "raw_bytes=$raw" | tee wasm-size.txt
          echo "gzip_bytes=$gzip" | tee -a wasm-size.txt

          max_raw=$((250 * 1024))
          max_gzip=$((100 * 1024))
          if [ "$raw" -gt "$max_raw" ]; then
            echo "::error::WASM core is ${raw} bytes, over the ${max_raw}-byte budget"
            exit 1
          fi
          if [ "$gzip" -gt "$max_gzip" ]; then
            echo "::error::WASM core is ${gzip} bytes gzipped, over the ${max_gzip}-byte budget"
            exit 1
          fi

      - name: Smoke test in Node
        run: |
          node - <<'NODE'
          const assert = require("node:assert/strict");
          const core = require("./crates/thar-wasm/pkg/thar_wasm.js");

          const version = core.coreVersion();
          assert.equal(typeof version, "string");
          assert.notEqual(version.length, 0);

          const parsed = JSON.parse(core.parseFile("one\nx 2024-01-01 two\n", "2026-11-15"));
          assert.equal(parsed.ok, true);
          assert.equal(parsed.todos.length, 2);
          assert.equal(parsed.todos[0].text, "one");
          assert.equal(parsed.todos[1].state, "done");
          assert.equal(parsed.todos[1].completionDate, "2024-01-01");

          const rejected = JSON.parse(core.parseFile("bad\n\u0000\n", "2026-11-15"));
          assert.equal(rejected.ok, false);
          assert.equal(rejected.error.code, "CONTROL_CHARACTER");
          assert.equal(rejected.error.lineNumber, 2);

          console.log(`wasm smoke ok (core ${version})`);
          NODE

      - name: Install Node dependencies
        run: npm ci

      # The real-package test in this file is skipped in the Node matrix, where
      # `crates/thar-wasm/pkg/` does not exist; running it here proves the
      # adapter against the package this job just built (it also covers the
      # fake-package tests, which must keep passing next to a real one).
      - name: Adapter tests against the built package
        # `core-wasm.test.ts` covers the parse/rows/serialize adapters;
        # `todo-file-write-safety.test.ts` includes the real-package corpus
        # round-trip, so the byte-compared dual write runs against this build.
        run: |
          npx vitest run unit-tests/core-wasm.test.ts unit-tests/todo-from-parts.test.ts unit-tests/todo-file-write-safety.test.ts

      # The CP1 oracle stays the Node `port-contract` job; this run proves the
      # Rust candidate agrees with it over the whole corpus, including the
      # 10 000-todo file, the BOM fixture and invalid UTF-8.
      - name: CP1 contract parity (WASM candidate)
        run: npm run port:contract:wasm

      # CP3b: the live rows contract against the WASM candidate, including the
      # generated 1 000-todo list. The TS-only half runs in the Node
      # `port-contract` job.
      - name: CP3b rows contract parity (WASM candidate)
        run: npm run port:contract:rows:wasm

      # CP4: `serialize_file` against `serializeTodosForWrite` over every
      # parseable fixture's structured records, including the write-time guard
      # probes. The TS-only half (mutation proof) runs in the Node
      # `port-contract` job.
      - name: CP4 write contract parity (WASM candidate)
        run: npm run port:contract:write:wasm

      # CP3b2c: the wired `THAR_CORE=rust` read path (`parseFile` records ->
      # `Todo.fromParts` -> serialize) against the TypeScript reader over every
      # fixture, including the rejection records. The TS-only half (lossless
      # factory + mutation proof) runs in the Node `port-contract` job.
      - name: CP3b2c parse contract parity (WASM candidate)
        run: npm run port:contract:parse:wasm

      - name: Upload WASM package
        uses: actions/upload-artifact@v4
        with:
          name: thar-wasm
          path: |
            crates/thar-wasm/pkg/**
            wasm-size.txt
          retention-days: 14
