name: Release

on:
  push:
    branches: ["main", "release/next"]
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        type: choice
        options: [stable, beta]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    environment: npm
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      skip: ${{ steps.check.outputs.skip }}
      tag_exists: ${{ steps.check.outputs.tag_exists }}

    steps:
      - name: Setup repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      # The published package ships the real WASM core: `prepack` builds it, so
      # the publish job needs Rust and wasm-pack.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.1

      - name: Install binaryen
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen
          wasm-opt --version

      - name: Resolve release
        id: release
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          channel="${INPUT_CHANNEL:-}"
          if [ -z "$channel" ]; then
            if [ "$REF_NAME" = "release/next" ]; then
              channel="beta"
            else
              channel="stable"
            fi
          fi

          if [ "$channel" = "stable" ] && [ "$REF_NAME" != "main" ]; then
            echo "Stable releases must run from main, not $REF_NAME" >&2
            exit 1
          fi

          base="$(node -p "require('./package.json').version")"
          if [ "$channel" = "beta" ]; then
            version="${base}-beta.${RUN_NUMBER}"
            dist_tag="next"
          else
            version="$base"
            dist_tag="latest"
          fi

          {
            echo "channel=$channel"
            echo "version=$version"
            echo "tag=v$version"
            echo "dist_tag=$dist_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Check whether this release already exists
        id: check
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          CHANNEL: ${{ steps.release.outputs.channel }}
        run: |
          tag_exists=false
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            tag_exists=true
          fi

          npm_exists=false
          if npm view "@arnoarnoarno/thar@$VERSION" version >/dev/null 2>&1; then
            npm_exists=true
          fi

          skip=false
          if [ "$npm_exists" = true ] && { [ "$CHANNEL" = "stable" ] || [ "$tag_exists" = true ]; }; then
            skip=true
          fi

          {
            echo "tag_exists=$tag_exists"
            echo "npm_exists=$npm_exists"
            echo "skip=$skip"
          } >> "$GITHUB_OUTPUT"

          if [ "$skip" = true ]; then
            echo "$TAG is already released; skipping."
          fi

      - name: Create tag
        if: steps.check.outputs.skip != 'true' && steps.check.outputs.tag_exists != 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "refs/tags/$TAG"

      - name: Set package version
        if: steps.check.outputs.skip != 'true'
        env:
          CHANNEL: ${{ steps.release.outputs.channel }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [ "$CHANNEL" = "beta" ]; then
            npm version "$VERSION" --no-git-tag-version
          fi

      - name: Verify the tarball ships the WASM core
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          tarball="$(npm pack --silent | tail -n1)"
          contents="$(tar -tzf "$tarball")"
          for required in \
            package/crates/thar-wasm/pkg/thar_wasm.js \
            package/crates/thar-wasm/pkg/thar_wasm_bg.wasm; do
            if ! grep -qx "$required" <<<"$contents"; then
              echo "::error::$tarball is missing $required" >&2
              echo "$contents" >&2
              exit 1
            fi
          done
          echo "$tarball ships the WASM core ($(du -h "$tarball" | cut -f1))."

      # `npm publish` packs again (and `prepack` rebuilds the WASM), so the
      # tarball verified above is a preflight, not the published bytes.
      - name: Publish to npm
        if: steps.check.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: npm publish --provenance --access public --tag "$DIST_TAG"

      - name: Create or update GitHub release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          CHANNEL: ${{ steps.release.outputs.channel }}
        run: |
          previous=""
          if [ "$CHANNEL" = "beta" ]; then
            previous="$(git tag -l 'v*-beta.*' | grep -v "^$TAG$" | sort -V | tail -n1 || true)"
          else
            previous="$(git tag -l 'v*' | grep -v -- '-' | grep -v "^$TAG$" | sort -V | tail -n1 || true)"
          fi

          start_args=()
          if [ -n "$previous" ]; then
            start_args+=(--notes-start-tag "$previous")
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$CHANNEL" = "beta" ]; then
              gh release edit "$TAG" --prerelease
            else
              gh release edit "$TAG" --latest
            fi
          else
            if [ "$CHANNEL" = "beta" ]; then
              gh release create "$TAG" \
                --title "$TAG" \
                --generate-notes \
                --prerelease \
                "${start_args[@]}"
            else
              gh release create "$TAG" \
                --title "$TAG" \
                --generate-notes \
                --latest \
                "${start_args[@]}"
            fi
          fi

  # `thar-rs` is the Rust TUI binary (docs/rust-port/PLAN.md, CP6/CP8). Build
  # it on a native host per target: macOS cannot be cross-compiled from Linux,
  # and native arm64 Linux keeps the glibc ABI honest. The job waits for
  # `publish` because that step creates the GitHub release the archives attach
  # to; npm publication must not depend on these platform builds.
  native:
    name: native (${{ matrix.target }})
    needs: publish
    # A normal release creates the tag/release in `publish`; an idempotent
    # re-run skips publishing but the tag still exists, so the native assets can
    # be rebuilt and re-attached with `--clobber`.
    if: needs.publish.outputs.skip != 'true' || needs.publish.outputs.tag_exists == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc floor at 2.35, so the archive runs on
          # the oldest still-supported LTS hosts.
          - target: linux-x64
            os: ubuntu-22.04
          - target: linux-arm64
            os: ubuntu-22.04-arm
          - target: macos-x64
            os: macos-15-intel
          - target: macos-arm64
            os: macos-15
          - target: windows-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Setup repo
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: native-${{ matrix.target }}

      - name: Build thar-rs
        env:
          # Report the release tag's version from `thar-rs --version` instead
          # of the crate's independent 0.1.0 development version.
          THAR_BUILD_VERSION: ${{ needs.publish.outputs.version }}
        run: cargo build --locked --release -p thar-cli

      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          ./target/release/thar-rs --version
          ./target/release/thar-rs --help >/dev/null

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\target\release\thar-rs.exe --version
          .\target\release\thar-rs.exe --help | Out-Null

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          asset="thar-${TARGET}.tar.gz"
          mkdir -p stage
          cp target/release/thar-rs README.md LICENSE stage/
          tar -czf "$asset" -C stage thar-rs README.md LICENSE
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
          ls -l "$asset" "$asset.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $asset = "thar-$env:TARGET.zip"
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item target/release/thar-rs.exe stage
          Copy-Item README.md, LICENSE stage
          Compress-Archive -Path "stage/*" -DestinationPath $asset
          $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLower()
          "$hash  $asset" | Out-File -Encoding ascii "$asset.sha256"
          Get-Item $asset, "$asset.sha256" | Format-Table Name, Length

      - name: Attach to the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: gh release upload "$TAG" thar-* --clobber
