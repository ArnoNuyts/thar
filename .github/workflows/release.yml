name: Release

on:
  push:
    branches: ["main", "release/next"]
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        type: choice
        options: [stable, beta]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
            ext: ""
          - os: ubuntu-24.04-arm
            name: linux-arm64
            ext: ""
          - os: windows-latest
            name: windows-x64
            ext: ".exe"
          - os: macos-latest
            name: macos-arm64
            ext: ""
          - os: macos-15-intel
            name: macos-x64
            ext: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Setup repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build single executable
        env:
          SEA_OUTPUT: todotui-${{ matrix.name }}${{ matrix.ext }}
        run: npm run build:sea

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: todotui-${{ matrix.name }}
          path: dist/todotui-*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    environment: npm

    steps:
      - name: Setup repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Resolve release
        id: release
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          channel="${INPUT_CHANNEL:-}"
          if [ -z "$channel" ]; then
            if [ "$REF_NAME" = "release/next" ]; then
              channel="beta"
            else
              channel="stable"
            fi
          fi

          if [ "$channel" = "stable" ] && [ "$REF_NAME" != "main" ]; then
            echo "Stable releases must run from main, not $REF_NAME" >&2
            exit 1
          fi

          base="$(node -p "require('./package.json').version")"
          if [ "$channel" = "beta" ]; then
            version="${base}-beta.${RUN_NUMBER}"
            dist_tag="next"
          else
            version="$base"
            dist_tag="latest"
          fi

          {
            echo "channel=$channel"
            echo "version=$version"
            echo "tag=v$version"
            echo "dist_tag=$dist_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Check whether this release already exists
        id: check
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          CHANNEL: ${{ steps.release.outputs.channel }}
        run: |
          tag_exists=false
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            tag_exists=true
          fi

          npm_exists=false
          if npm view "todotui@$VERSION" version >/dev/null 2>&1; then
            npm_exists=true
          fi

          skip=false
          if [ "$npm_exists" = true ] && { [ "$CHANNEL" = "stable" ] || [ "$tag_exists" = true ]; }; then
            skip=true
          fi

          {
            echo "tag_exists=$tag_exists"
            echo "npm_exists=$npm_exists"
            echo "skip=$skip"
          } >> "$GITHUB_OUTPUT"

          if [ "$skip" = true ]; then
            echo "$TAG is already released; skipping."
          fi

      - name: Create tag
        if: steps.check.outputs.skip != 'true' && steps.check.outputs.tag_exists != 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "refs/tags/$TAG"

      - name: Download binaries
        if: steps.check.outputs.skip != 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: todotui-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        if: steps.check.outputs.skip != 'true'
        run: node scripts/checksums.mjs dist

      - name: Publish to npm
        if: steps.check.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: npm publish --provenance --access public --tag "$DIST_TAG"

      - name: Create or update GitHub release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          CHANNEL: ${{ steps.release.outputs.channel }}
        run: |
          previous=""
          if [ "$CHANNEL" = "beta" ]; then
            previous="$(git tag -l 'v*-beta.*' | grep -v "^$TAG$" | sort -V | tail -n1 || true)"
          else
            previous="$(git tag -l 'v*' | grep -v -- '-' | grep -v "^$TAG$" | sort -V | tail -n1 || true)"
          fi

          start_args=()
          if [ -n "$previous" ]; then
            start_args+=(--notes-start-tag "$previous")
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            if [ "$CHANNEL" = "beta" ]; then
              gh release edit "$TAG" --prerelease
            else
              gh release edit "$TAG" --latest
            fi
          else
            if [ "$CHANNEL" = "beta" ]; then
              gh release create "$TAG" dist/* \
                --title "$TAG" \
                --generate-notes \
                --prerelease \
                "${start_args[@]}"
            else
              gh release create "$TAG" dist/* \
                --title "$TAG" \
                --generate-notes \
                --latest \
                "${start_args[@]}"
            fi
          fi
